name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release (pubspec lower bound) and latest stable.
        # An empty version means "latest on the stable channel".
        include:
          - label: '3.27.4'
            version: '3.27.4'
          - label: stable
            version: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true
      # The minimum-Flutter leg verifies the published PACKAGE only. example/ is a demo app that
      # tracks latest dependencies (needs a newer Dart than the package supports), so it is
      # analyzed and built on stable in its own job.
      - if: matrix.label == '3.27.4'
        run: |
          rm -rf example
          # Demo/smoke tests that import example/ code cannot run without it.
          grep -rl --include='*.dart' -E '\.\./example/' lib test tool 2>/dev/null | xargs -r rm -v || true
      - run: flutter pub get
      # The formatter style changed in Dart 3.7, so only check it on latest stable.
      - if: matrix.label == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  build-example-web:
    name: Build example (web, WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Build example for web with WASM
        working-directory: example
        run: |
          flutter pub get
          flutter build web --wasm

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
