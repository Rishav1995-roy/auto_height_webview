name: Publish to pub.dev

# Pushing a tag like v1.2.3 publishes that version to pub.dev.
# Needs "Automated publishing" enabled on the package's pub.dev Admin page
# (repository Rishav1995-roy/auto_height_webview, tag pattern v{{version}}).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token that pub.dev uses to authenticate this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sets up the pub.dev credentials from the OIDC token.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
