name: auto_height_webview
description: "A Flutter widget that renders HTML and automatically sizes itself to the content height on Android, iOS, macOS and web."
version: 0.0.3
homepage: https://github.com/Rishav1995-roy/auto_height_webview
repository: https://github.com/Rishav1995-roy/auto_height_webview
issue_tracker: https://github.com/Rishav1995-roy/auto_height_webview/issues

topics:
  - webview
  - html
  - auto-height
  - widget

screenshots:
  - description: Demo - cards sizing themselves to HTML content, images and dynamic changes.
    path: doc/demo.gif
  - description: Example app in light mode.
    path: doc/screenshot_light.png
  - description: Example app in dark mode with themed CSS and a full HTML document.
    path: doc/screenshot_dark.png
  - description: Min/max height with inner scrolling, links and images.
    path: doc/screenshot_features.png

platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ">=4.11.0 <5.0.0"
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  mocktail: ^1.0.4
  webview_flutter_platform_interface: ^2.10.0
